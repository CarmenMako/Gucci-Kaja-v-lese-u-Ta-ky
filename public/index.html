<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Gucci Kája v Lese u Taťky</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; touch-action: none; color: white; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Zaměřovací kříž */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ff3366; box-shadow: 0 0 6px #ff3366; }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        /* Top Bar UI */
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 20; }
        h1 { font-size: 14px; font-weight: 900; color: #ff3366; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        .stats-card { margin-top: 4px; background: rgba(10, 15, 25, 0.85); border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 10px; display: flex; gap: 10px; font-size: 11px; font-weight: 700; }

        /* Prepinac zbrani Roblox Style */
        #inventory { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 30; pointer-events: auto; }
        .slot { width: 65px; height: 50px; background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(255,255,255,0.2); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; cursor: pointer; backdrop-filter: blur(8px); }
        .slot.active { border-color: #ff3366; background: rgba(255, 51, 102, 0.35); box-shadow: 0 0 12px rgba(255, 51, 102, 0.5); }
        .slot-icon { font-size: 16px; }

        /* Start Modal */
        #name-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #030508; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: rgba(20, 30, 45, 0.9); border: 2px solid #ff3366; padding: 25px; border-radius: 20px; text-align: center; width: 310px; box-shadow: 0 0 30px rgba(255, 51, 102, 0.3); }
        .modal-box h2 { color: #ff3366; margin-bottom: 10px; font-size: 20px; }
        .modal-box input { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #0b111e; color: white; text-align: center; margin-bottom: 15px; outline: none; }
        .modal-box button { width: 100%; padding: 12px; font-size: 15px; font-weight: 900; background: #ff3366; color: white; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; }

        /* Joystick Levý Palec */
        #joystick-container { width: 100px; height: 100px; position: absolute; bottom: 20px; left: 20px; pointer-events: auto; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 30; }
        #joystick { width: 44px; height: 44px; background: #fff; border-radius: 50%; position: absolute; top: 28px; left: 28px; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* Akční tlačítka Pravý Palec */
        .action-buttons { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 12px; z-index: 30; pointer-events: auto; }
        .btn { width: 62px; height: 62px; background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; color: white; font-weight: 900; font-size: 9px; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 6px 15px rgba(0,0,0,0.6); }
        .btn:active { transform: scale(0.9); }
        #btn-action { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); }
        #btn-build { border-color: #f59e0b; background: rgba(245, 158, 11, 0.25); }

        /* Dotyková plocha pro kameru CoD style */
        #look-touch-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 10; pointer-events: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="name-modal">
        <div class="modal-box">
            <h2>GUCCI KÁJA V LESE</h2>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:15px;">Roblox Survival Edition</p>
            <input type="text" id="player-name-input" value="Královna Kája" maxlength="15">
            <button id="start-game-btn">HRÁT HRU</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>
    <div id="look-touch-zone"></div>

    <div id="inventory">
        <div class="slot active" id="slot-axe"><span class="slot-icon">🪓</span>SEKYRA</div>
        <div class="slot" id="slot-gun"><span class="slot-icon">🔫</span>SAMOPAL</div>
    </div>

    <div id="ui">
        <h1>GUCCI KÁJA V LESE</h1>
        <div class="stats-card">
            <div>🪵 Dřevo: <span id="wood-count">0</span></div>
            <div>🥩 Maso: <span id="meat-count">0</span></div>
            <div>❤️ HP: <span id="hp-count">100</span></div>
            <div>☀️ <span id="time-status">Den</span></div>
        </div>
    </div>

    <div id="joystick-container">
        <div id="joystick"></div>
    </div>

    <div class="action-buttons">
        <div class="btn" id="btn-action"><span style="font-size:18px;" id="action-icon">🪓</span><span id="action-text">SEKAT</span></div>
        <div class="btn" id="btn-build"><span style="font-size:18px;">🪵</span>STAVĚT</div>
    </div>

    <script>
        const socket = io();
        let activeTool = 'axe'; // 'axe' nebe 'gun'

        document.getElementById('start-game-btn').addEventListener('click', () => {
            document.getElementById('name-modal').style.display = 'none';
            socket.emit('joinGame', document.getElementById('player-name-input').value.trim() || "Kája");
        });

        // Přepínání výbavy
        document.getElementById('slot-axe').addEventListener('click', () => {
            activeTool = 'axe';
            document.getElementById('slot-axe').classList.add('active');
            document.getElementById('slot-gun').classList.remove('active');
            document.getElementById('action-icon').innerText = '🪓';
            document.getElementById('action-text').innerText = 'SEKAT';
            updateWeaponModel();
        });

        document.getElementById('slot-gun').addEventListener('click', () => {
            activeTool = 'gun';
            document.getElementById('slot-gun').classList.add('active');
            document.getElementById('slot-axe').classList.remove('active');
            document.getElementById('action-icon').innerText = '💥';
            document.getElementById('action-text').innerText = 'PALBA';
            updateWeaponModel();
        });

        // --- SCÉNA A OSVĚTLENÍ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1527);
        scene.fog = new THREE.FogExp2(0x0d1527, 0.018);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Země
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(220, 220),
            new THREE.MeshStandardMaterial({ color: 0x1a331e, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Stromy
        const trees = [];
        for(let i=0; i<65; i++) {
            const x = (Math.random() - 0.5) * 180;
            const z = (Math.random() - 0.5) * 180;
            if(Math.hypot(x, z) > 7) {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                trunk.position.y = 2;
                trunk.castShadow = true;
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.4, 5, 6), new THREE.MeshStandardMaterial({ color: 0x0f421f }));
                leaves.position.y = 5;
                leaves.castShadow = true;
                group.add(trunk, leaves);
                group.position.set(x, 0, z);
                scene.add(group);
                trees.push({ x, z, mesh: group });
            }
        }

        // --- ZVÍŘATA (VLCI) ---
        const wolves = [];
        function spawnWolf() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 1.3), new THREE.MeshStandardMaterial({ color: 0x3a3a3a }));
            body.position.y = 0.5;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            head.position.set(0, 0.8, -0.6);
            group.add(body, head);
            const x = (Math.random() - 0.5) * 150;
            const z = (Math.random() - 0.5) * 150;
            group.position.set(x, 0, z);
            scene.add(group);
            wolves.push({ mesh: group, hp: 3 });
        }
        for(let i=0; i<4; i++) spawnWolf();

        // --- PROFI ROBLOX BLOCKY MODEL POSTAVINY ---
        const queen = new THREE.Group();
        const matSkin = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const matDress = new THREE.MeshStandardMaterial({ color: 0xff2a5f });
        const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });

        // Trup (Roblox Blocky)
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), matDress);
        torso.position.y = 1.05;
        torso.castShadow = true;
        queen.add(torso);

        // Hlava
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matSkin);
        head.position.y = 1.75;
        head.castShadow = true;
        queen.add(head);

        // Zlatá Koruna se špičkami
        const crown = new THREE.Group();
        const crownBase = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.12, 0.54), matGold);
        crown.add(crownBase);
        for(let i=0; i<4; i++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 4), matGold);
            spike.position.set((i===0?0.2:i===1?-0.2:0), 0.12, (i===2?0.2:i===3?-0.2:0));
            crown.add(spike);
        }
        crown.position.y = 2.05;
        queen.add(crown);

        // Nohy
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.6, 0.35), matDress);
        legL.position.set(-0.2, 0.3, 0);
        const legR = legL.clone();
        legR.position.x = 0.2;
        queen.add(legL, legR);

        // Ruce a Držák Zbraně
        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.3), matSkin);
        armR.position.set(0.58, 1.05, 0);
        queen.add(armR);

        const weaponGroup = new THREE.Group();
        armR.add(weaponGroup);
        weaponGroup.position.set(0, -0.2, -0.3);

        function updateWeaponModel() {
            while(weaponGroup.children.length > 0) weaponGroup.remove(weaponGroup.children[0]);
            if(activeTool === 'axe') {
                const axeHandle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.08), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
                const axeBlade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9 }));
                axeBlade.position.set(0, 0.25, -0.1);
                weaponGroup.add(axeHandle, axeBlade);
            } else {
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.7), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 }));
                weaponGroup.add(gun);
            }
        }
        updateWeaponModel();
        scene.add(queen);

        let wood = 0, meat = 0, hp = 100;
        let playerPosX = 0, playerPosZ = 0;
        let cameraAngleY = 0;

        // --- INVERTOVANÝ A PŘESNÝ JOYSTICK ---
        const joystick = document.getElementById('joystick');
        const joystickContainer = document.getElementById('joystick-container');
        let joyMove = { x: 0, y: 0 };
        const joyRect = joystickContainer.getBoundingClientRect();
        const joyRadius = joyRect.width / 2;
        const joyCenter = joyRect.width / 2;

        joystick.addEventListener('touchstart', (e) => e.preventDefault());
        document.addEventListener('touchend', () => {
            joystick.style.transform = `translate(0px, 0px)`;
            joyMove = { x: 0, y: 0 };
        });
        document.addEventListener('touchmove', (e) => {
            if(!e.touches.length) return;
            const touch = e.touches[0];
            const dx = touch.clientX - joyRect.left - joyCenter;
            const dy = touch.clientY - joyRect.top - joyCenter;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const clampedDist = Math.min(dist, joyRadius);
            const angle = Math.atan2(dy, dx);
            joystick.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
            
            // OPRAVENO: Když dáš dolů (dy > 0), pohyb je DOZADU
            joyMove = { 
                x: (Math.cos(angle) * clampedDist) / joyRadius, 
                y: (Math.sin(angle) * clampedDist) / joyRadius 
            };
        });

        // --- PRAVÝ PALEC OTÁČENÍ KAMERY (CoD Style) ---
        let isLooking = false;
        let lastTouchX = 0;
        const lookZone = document.getElementById('look-touch-zone');
        lookZone.addEventListener('touchstart', (e) => { isLooking = true; lastTouchX = e.touches[0].clientX; });
        lookZone.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            const currentX = e.touches[0].clientX;
            cameraAngleY -= (currentX - lastTouchX) * 0.006;
            lastTouchX = currentX;
        });
        lookZone.addEventListener('touchend', () => { isLooking = false; });

        // --- AKČNÍ TLAČÍTKO ---
        document.getElementById('btn-action').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(activeTool === 'axe') {
                trees.forEach(tree => {
                    if(Math.hypot(playerPosX - tree.x, playerPosZ - tree.z) < 5) {
                        wood += 4;
                        document.getElementById('wood-count').innerText = wood;
                    }
                });
            } else {
                wolves.forEach((wolf, idx) => {
                    if(Math.hypot(playerPosX - wolf.mesh.position.x, playerPosZ - wolf.mesh.position.z) < 10) {
                        wolf.hp--;
                        if(wolf.hp <= 0) {
                            scene.remove(wolf.mesh);
                            wolves.splice(idx, 1);
                            meat += 3;
                            document.getElementById('meat-count').innerText = meat;
                            setTimeout(spawnWolf, 6000);
                        }
                    }
                });
            }
        });

        // Stavění
        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(wood >= 10) {
                wood -= 10;
                document.getElementById('wood-count').innerText = wood;
                const bx = playerPosX + Math.sin(cameraAngleY) * 2.5;
                const bz = playerPosZ + Math.cos(cameraAngleY) * 2.5;
                const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                bar.position.set(bx, 0.75, bz);
                scene.add(bar);
            }
        });

        // --- GAME LOOP ---
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            // Pohyb opravený
            if (joyMove.x !== 0 || joyMove.y !== 0) {
                const moveX = (-joyMove.x * Math.cos(cameraAngleY) + joyMove.y * Math.sin(cameraAngleY));
                const moveZ = (-joyMove.x * Math.sin(cameraAngleY) - joyMove.y * Math.cos(cameraAngleY));
                
                playerPosX += moveX * speed;
                playerPosZ += moveZ * speed;

                queen.position.set(playerPosX, 0, playerPosZ);
                queen.rotation.y = cameraAngleY + Math.atan2(joyMove.x, -joyMove.y);
            }

            // Útok vlků
            wolves.forEach(wolf => {
                const dx = playerPosX - wolf.mesh.position.x;
                const dz = playerPosZ - wolf.mesh.position.z;
                const dist = Math.hypot(dx, dz);
                if(dist < 25) {
                    wolf.mesh.position.x += (dx / dist) * 0.05;
                    wolf.mesh.position.z += (dz / dist) * 0.05;
                    wolf.mesh.rotation.y = Math.atan2(dx, dz);
                }
            });

            // Kamera
            camera.position.x = playerPosX + Math.sin(cameraAngleY) * 6;
            camera.position.y = 3.5;
            camera.position.z = playerPosZ + Math.cos(cameraAngleY) * 6;
            camera.lookAt(playerPosX, 1.2, playerPosZ);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
