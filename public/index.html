<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Gucci Kája v Lese u Taťky</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; touch-action: none; color: white; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Zaměřovač */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ff3366; }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        /* UI Nahoře */
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 20; }
        h1 { font-size: 13px; font-weight: 900; color: #ff3366; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        .stats-card { margin-top: 4px; background: rgba(10, 15, 25, 0.85); border: 1px solid rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 8px; display: flex; gap: 8px; font-size: 10px; font-weight: 700; }

        /* Přepínač zbraní */
        #inventory { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 30; pointer-events: auto; }
        .slot { width: 60px; height: 45px; background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; cursor: pointer; }
        .slot.active { border-color: #ff3366; background: rgba(255, 51, 102, 0.35); }

        /* Start Modal */
        #name-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #030508; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: rgba(20, 30, 45, 0.95); border: 2px solid #ff3366; padding: 20px; border-radius: 16px; text-align: center; width: 280px; }
        .modal-box h2 { color: #ff3366; margin-bottom: 8px; font-size: 18px; }
        .modal-box input { width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0b111e; color: white; text-align: center; margin-bottom: 12px; outline: none; }
        .modal-box button { width: 100%; padding: 10px; font-size: 14px; font-weight: 900; background: #ff3366; color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* Dotykové zóny pro rozdělení levá/pravá */
        .touch-zone-left { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; z-index: 10; pointer-events: auto; }
        .touch-zone-right { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 10; pointer-events: auto; }

        /* Vizuální joystick (ukáže se, kde se dotkneš vlevo) */
        #virtual-joystick { position: absolute; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 15; pointer-events: none; background: rgba(255,255,255,0.05); }
        #virtual-stick-inner { position: absolute; width: 36px; height: 36px; background: rgba(255,255,255,0.8); border-radius: 50%; top: 20px; left: 20px; }

        /* Akční tlačítka vpravo dole */
        .action-buttons { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 30; pointer-events: auto; }
        .btn { width: 58px; height: 58px; background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; color: white; font-weight: 900; font-size: 8px; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.9); }
        #btn-action { border-color: #38bdf8; background: rgba(56, 189, 248, 0.25); }
        #btn-build { border-color: #f59e0b; background: rgba(245, 158, 11, 0.25); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="name-modal">
        <div class="modal-box">
            <h2>GUCCI KÁJA V LESE</h2>
            <p style="font-size:11px; color:#94a3b8; margin-bottom:12px;">Nová opravená verze ovládání</p>
            <input type="text" id="player-name-input" value="Královna Kája" maxlength="15">
            <button id="start-game-btn">VSTOUPIT DO HRA</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <div class="touch-zone-left" id="zone-left"></div>
    <div class="touch-zone-right" id="zone-right"></div>

    <div id="virtual-joystick">
        <div id="virtual-stick-inner"></div>
    </div>

    <div id="inventory">
        <div class="slot active" id="slot-axe">🪓 SEKYRA</div>
        <div class="slot" id="slot-gun">🔫 ZBRANĚ</div>
    </div>

    <div id="ui">
        <h1>GUCCI KÁJA V LESE</h1>
        <div class="stats-card">
            <div>🪵 Dřevo: <span id="wood-count">0</span></div>
            <div>🥩 Maso: <span id="meat-count">0</span></div>
            <div>❤️ HP: <span id="hp-count">100</span></div>
        </div>
    </div>

    <div class="action-buttons">
        <div class="btn" id="btn-action"><span style="font-size:16px;" id="action-icon">🪓</span><span id="action-text">SEKAT</span></div>
        <div class="btn" id="btn-build"><span style="font-size:16px;">🪵</span>STAVĚT</div>
    </div>

    <script>
        const socket = io();
        let activeTool = 'axe';

        document.getElementById('start-game-btn').addEventListener('click', () => {
            document.getElementById('name-modal').style.display = 'none';
            socket.emit('joinGame', document.getElementById('player-name-input').value.trim() || "Kája");
        });

        document.getElementById('slot-axe').addEventListener('click', () => {
            activeTool = 'axe';
            document.getElementById('slot-axe').classList.add('active');
            document.getElementById('slot-gun').classList.remove('active');
            document.getElementById('action-icon').innerText = '🪓';
            document.getElementById('action-text').innerText = 'SEKAT';
            updateWeaponModel();
        });

        document.getElementById('slot-gun').addEventListener('click', () => {
            activeTool = 'gun';
            document.getElementById('slot-gun').classList.add('active');
            document.getElementById('slot-axe').classList.remove('active');
            document.getElementById('action-icon').innerText = '💥';
            document.getElementById('action-text').innerText = 'PALBA';
            updateWeaponModel();
        });

        // --- SCÉNA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080f1d);
        scene.fog = new THREE.FogExp2(0x080f1d, 0.02);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(40, 70, 30);
        sun.castShadow = true;
        scene.add(sun);

        // Země
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x162b1a, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Stromy
        const trees = [];
        for(let i=0; i<60; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            if(Math.hypot(x, z) > 6) {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                trunk.position.y = 2;
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5, 6), new THREE.MeshStandardMaterial({ color: 0x0f3d1f }));
                leaves.position.y = 5;
                group.add(trunk, leaves);
                group.position.set(x, 0, z);
                scene.add(group);
                trees.push({ x, z });
            }
        }

        // --- ROBLOX MODEL POSTAVY ---
        const queen = new THREE.Group();
        const matSkin = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const matDress = new THREE.MeshStandardMaterial({ color: 0xff2a5f });
        const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), matDress);
        torso.position.y = 1.05;
        queen.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matSkin);
        head.position.y = 1.75;
        queen.add(head);

        const crown = new THREE.Group();
        crown.add(new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.12, 0.54), matGold));
        crown.position.y = 2.05;
        queen.add(crown);

        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.3), matSkin);
        armR.position.set(0.58, 1.05, 0);
        queen.add(armR);

        const weaponGroup = new THREE.Group();
        armR.add(weaponGroup);
        weaponGroup.position.set(0, -0.2, -0.3);

        function updateWeaponModel() {
            while(weaponGroup.children.length > 0) weaponGroup.remove(weaponGroup.children[0]);
            if(activeTool === 'axe') {
                const h = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.08), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
                b.position.set(0, 0.25, -0.1);
                weaponGroup.add(h, b);
            } else {
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.7), new THREE.MeshStandardMaterial({ color: 0x111111 }));
                weaponGroup.add(gun);
            }
        }
        updateWeaponModel();
        scene.add(queen);

        let wood = 0, meat = 0, hp = 100;
        let playerPosX = 0, playerPosZ = 0;
        let cameraAngleY = 0;

        // --- DOKONALE ODŠELENÉ OVLÁDÁNÍ (LEVÁ = POHYB, PRAVÁ = KAMERA) ---
        let joyMove = { x: 0, y: 0 };
        let joyCenterCoord = { x: 0, y: 0 };
        const joystickEl = document.getElementById('virtual-joystick');
        const stickInner = document.getElementById('virtual-stick-inner');

        // Levá zóna - Joystick
        const zoneLeft = document.getElementById('zone-left');
        zoneLeft.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            joyCenterCoord = { x: t.clientX, y: t.clientY };
            joystickEl.style.display = 'block';
            joystickEl.style.left = t.clientX + 'px';
            joystickEl.style.top = t.clientY + 'px';
            stickInner.style.transform = `translate(0px, 0px)`;
        });

        zoneLeft.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            const dx = t.clientX - joyCenterCoord.x;
            const dy = t.clientY - joyCenterCoord.y;
            const dist = Math.hypot(dx, dy);
            const maxR = 35;
            const clamped = Math.min(dist, maxR);
            const angle = Math.atan2(dy, dx);
            
            stickInner.style.transform = `translate(${Math.cos(angle)*clamped}px, ${Math.sin(angle)*clamped}px)`;
            joyMove = { x: (Math.cos(angle)*clamped)/maxR, y: (Math.sin(angle)*clamped)/maxR };
        });

        zoneLeft.addEventListener('touchend', () => {
            joystickEl.style.display = 'none';
            joyMove = { x: 0, y: 0 };
        });

        // Pravá zóna - Otáčení kamery prstem
        const zoneRight = document.getElementById('zone-right');
        let lastRightX = 0;
        zoneRight.addEventListener('touchstart', (e) => {
            lastRightX = e.touches[0].clientX;
        });
        zoneRight.addEventListener('touchmove', (e) => {
            const currentX = e.touches[0].clientX;
            const deltaX = currentX - lastRightX;
            cameraAngleY -= deltaX * 0.006;
            lastRightX = currentX;
        });

        // --- AKCE ---
        document.getElementById('btn-action').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(activeTool === 'axe') {
                trees.forEach(tree => {
                    if(Math.hypot(playerPosX - tree.x, playerPosZ - tree.z) < 5) {
                        wood += 5;
                        document.getElementById('wood-count').innerText = wood;
                    }
                });
            } else {
                meat += 1;
                document.getElementById('meat-count').innerText = meat;
            }
        });

        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(wood >= 10) {
                wood -= 10;
                document.getElementById('wood-count').innerText = wood;
                const bx = playerPosX + Math.sin(cameraAngleY) * 2.5;
                const bz = playerPosZ + Math.cos(cameraAngleY) * 2.5;
                const bar = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                bar.position.set(bx, 0.75, bz);
                scene.add(bar);
            }
        });

        // --- GAME LOOP ---
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            if (joyMove.x !== 0 || joyMove.y !== 0) {
                const moveX = (-joyMove.x * Math.cos(cameraAngleY) - joyMove.y * Math.sin(cameraAngleY));
                const moveZ = (-joyMove.x * Math.sin(cameraAngleY) + joyMove.y * Math.cos(cameraAngleY));
                
                playerPosX += moveX * speed;
                playerPosZ += moveZ * speed;

                queen.position.set(playerPosX, 0, playerPosZ);
                queen.rotation.y = cameraAngleY + Math.atan2(-joyMove.x, -joyMove.y);
            }

            camera.position.x = playerPosX + Math.sin(cameraAngleY) * 6;
            camera.position.y = 3.5;
            camera.position.z = playerPosZ + Math.cos(cameraAngleY) * 6;
            camera.lookAt(playerPosX, 1.2, playerPosZ);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
