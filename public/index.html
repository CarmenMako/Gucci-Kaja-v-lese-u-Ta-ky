
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101323">
<title>GUCCI KAJA — World</title>
<style>
:root{--glass:rgba(15,19,38,.88);--gold:#ffd76b;--pink:#ff76c8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91c9ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{display:block}
button,input{font:inherit}
#game{position:fixed;inset:0}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:var(--glass);color:white;border:1px solid #ffffff25;border-radius:16px;padding:10px 13px;backdrop-filter:blur(12px);box-shadow:0 5px 25px #0002}
.logo{font-weight:1000;letter-spacing:1px;font-size:17px;color:var(--gold)}
.small{font-size:11px;color:#c6cce0}
#stats{text-align:right;font-size:12px}
#cross{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);color:white;font-size:25px;text-shadow:0 2px 6px black;pointer-events:none}
#bottom{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
#bottom>*{pointer-events:auto}
#joy{width:116px;height:116px;border-radius:50%;background:#10132375;border:2px solid #ffffff65;position:relative;touch-action:none;flex-shrink:0}
#knob{position:absolute;width:44px;height:44px;left:34px;top:34px;border-radius:50%;background:#ffffffb9;border:2px solid white;pointer-events:none}
#actions{display:flex;gap:7px;align-items:flex-end}
.action{width:59px;height:59px;border:1px solid #ffffff65;border-radius:18px;background:var(--glass);color:white;font-size:22px;font-weight:900;box-shadow:0 4px 14px #0003;touch-action:manipulation}
.action:active{transform:scale(.94);background:#454b68}
.action span{display:block;font-size:9px;font-weight:700;margin-top:2px}
#jump{width:66px;height:66px;border-radius:50%;background:#a74dffdd}
#chatbox{position:absolute;left:12px;top:90px;width:min(260px,67vw);pointer-events:none}
#messages{color:white;font-size:12px;text-shadow:0 1px 3px black;max-height:100px;overflow:hidden}
#chatrow{display:flex;gap:4px;pointer-events:auto;margin-top:5px}
#chatinput{min-width:0;width:100%;border:1px solid #ffffff44;border-radius:9px;background:#101323d9;color:white;padding:8px;font-size:12px}
#send{border:0;border-radius:9px;background:var(--gold);padding:7px 10px;font-weight:900}
#tools{position:absolute;top:85px;right:12px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.tool{background:var(--glass);color:white;border:1px solid #ffffff33;border-radius:11px;padding:8px 10px;font-size:12px}
.tool.selected{border-color:var(--gold);color:var(--gold)}
#lookhint{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);font-size:11px;color:white;background:#1118279c;padding:5px 10px;border-radius:20px;white-space:nowrap;pointer-events:none}
#start{position:absolute;inset:0;background:linear-gradient(160deg,#101323ed,#20294bea);display:flex;align-items:center;justify-content:center;padding:22px;z-index:10}
#card{width:min(390px,100%);padding:26px;background:#171c30;border:1px solid #ffffff26;border-radius:26px;color:white;box-shadow:0 25px 80px #0006}
#card h1{font-size:34px;line-height:1;margin:0 0 8px;color:var(--gold);letter-spacing:1px}
#card p{font-size:13px;color:#c3cbe1;line-height:1.6}
#name{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff35;background:#0c1020;color:white;margin:10px 0}
#play{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(100deg,#ffcf62,#ff8dba);font-weight:1000;color:#171323}
#status{font-size:11px;color:#aab5d1;margin-top:12px}
#notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#111827e8;color:white;padding:12px 18px;border-radius:13px;display:none;pointer-events:none}
@media(min-width:800px){#joy{width:125px;height:125px}#knob{left:38px;top:38px}#bottom{bottom:20px}#tools{top:100px}#lookhint{bottom:155px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="top">
  <div class="panel">
    <div class="logo">👑 GUCCI KAJA</div>
    <div class="small">YOUR WORLD · YOUR RULES</div>
  </div>
  <div class="panel" id="stats">
    <div id="connection">Připojování…</div>
    <div id="players">Hráči: 1</div>
  </div>
</div>

<div id="cross">+</div>

<div id="chatbox">
  <div id="messages"></div>
  <div id="chatrow">
    <input id="chatinput" maxlength="180" placeholder="Napiš zprávu…">
    <button id="send">➤</button>
  </div>
</div>

<div id="tools">
  <button class="tool selected" data-type="grass">🟩 Tráva</button>
  <button class="tool" data-type="dirt">🟫 Hlína</button>
  <button class="tool" data-type="stone">⬜ Kámen</button>
  <button class="tool" data-type="gold">🟨 Zlato</button>
  <button class="tool" data-type="pink">🩷 Pink</button>
  <button class="tool" id="camera">📷 Kamera</button>
</div>

<div id="lookhint">Táhni prstem po obrazovce pro otočení kamery</div>

<div id="bottom">
  <div id="joy"><div id="knob"></div></div>
  <div id="actions">
    <button class="action" id="break">⛏️<span>BOURAT</span></button>
    <button class="action" id="place">🧱<span>STAVĚT</span></button>
    <button class="action" id="jump">⬆️<span>SKOK</span></button>
  </div>
</div>

<div id="notice"></div>

<div id="start">
  <div id="card">
    <div style="font-size:45px;margin-bottom:12px">👑 💎 🏰</div>
    <h1>GUCCI KAJA</h1>
    <div style="color:#ff8dba;font-weight:800;font-size:12px;letter-spacing:2px">BUILD YOUR KINGDOM</div>
    <p>Vstup do 3D světa. Stavěj, nič bloky, prozkoumávej ostrov a potkávej další hráče online.</p>
    <label for="name" style="font-size:12px">Tvoje přezdívka</label>
    <input id="name" maxlength="18" placeholder="Např. GucciKaja" value="GucciKaja">
    <button id="play">VSTOUPIT DO SVĚTA →</button>
    <div id="status">Připravuji svět…</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const $ = id => document.getElementById(id);
const game = $("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ecbff);
scene.fog = new THREE.Fog(0x8ecbff, 35, 105);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, .1, 250);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x64704a,2.0));
const sun = new THREE.DirectionalLight(0xfff0d0,2.5);
sun.position.set(20,35,15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mats = {
  grass:new THREE.MeshStandardMaterial({color:0x64bd55,roughness:1}),
  dirt:new THREE.MeshStandardMaterial({color:0x91603e,roughness:1}),
  stone:new THREE.MeshStandardMaterial({color:0x9ba5b4,roughness:.9}),
  gold:new THREE.MeshStandardMaterial({color:0xffc928,metalness:.55,roughness:.25}),
  pink:new THREE.MeshStandardMaterial({color:0xff73c9,roughness:.5}),
  wood:new THREE.MeshStandardMaterial({color:0x84502b}),
  leaf:new THREE.MeshStandardMaterial({color:0x22874d}),
  white:new THREE.MeshStandardMaterial({color:0xffffff}),
  skin:new THREE.MeshStandardMaterial({color:0xffd0a5}),
  purple:new THREE.MeshStandardMaterial({color:0x8748e8}),
  black:new THREE.MeshStandardMaterial({color:0x242337})
};

const cubeGeo = new THREE.BoxGeometry(1,1,1);
const blockMeshes = new Map();
const remotePlayers = new Map();
const raycaster = new THREE.Raycaster();
const center = new THREE.Vector2(0,0);

let socket=null, joined=false, myId=null;
let selectedType="grass", cameraMode=0;
let yaw=0, pitch=.23;
let joyX=0, joyY=0, velocityY=0;
let onGround=false, lastMove=0, lastChat=0;
let playerName="GucciKaja";
const world={x:0,y:1.01,z:0};
const keys={};
const clock=new THREE.Clock();

const avatar = new THREE.Group();
scene.add(avatar);

function box(parent, material, x,y,z, sx,sy,sz) {
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

// Hráč s korunou a barevným oblečením
box(avatar,mats.purple,0,.78,0,.58,.68,.34);
box(avatar,mats.skin,0,1.35,0,.43,.43,.4);
box(avatar,mats.black,0,1.53,0,.44,.12,.42);
box(avatar,mats.white,-.105,1.37,.205,.055,.055,.025);
box(avatar,mats.white,.105,1.37,.205,.055,.055,.025);
box(avatar,mats.black,-.105,1.37,.225,.025,.035,.02);
box(avatar,mats.black,.105,1.37,.225,.025,.035,.02);
box(avatar,mats.gold,0,1.65,0,.46,.12,.25);
box(avatar,mats.gold,-.15,1.77,0,.08,.15,.13);
box(avatar,mats.gold,0,1.80,0,.08,.20,.13);
box(avatar,mats.gold,.15,1.77,0,.08,.15,.13);
box(avatar,mats.black,-.17,.22,0,.19,.43,.24);
box(avatar,mats.black,.17,.22,0,.19,.43,.24);

const nameSprites = new Map();

function makeLabel(text,color="#ffffff") {
  const c=document.createElement("canvas");
  c.width=512;c.height=128;
  const ctx=c.getContext("2d");
  ctx.font="bold 44px system-ui";
  ctx.textAlign="center";
  ctx.fillStyle="#15172acc";
  ctx.fillRect(36,24,440,78);
  ctx.fillStyle=color;
  ctx.fillText(text,256,77,420);
  const tex=new THREE.CanvasTexture(c);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sprite.scale.set(2.4,.6,1);
  return sprite;
}

const myLabel=makeLabel(playerName,"#ffdf80");
myLabel.position.set(0,2.25,0);
avatar.add(myLabel);

function addBlock(b) {
  const key=`${b.x},${b.y},${b.z}`;
  if(blockMeshes.has(key)) return;
  const mesh=new THREE.Mesh(cubeGeo,mats[b.type]||mats.grass);
  mesh.position.set(b.x,b.y,b.z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  mesh.userData.block={x:b.x,y:b.y,z:b.z,type:b.type};
  scene.add(mesh);
  blockMeshes.set(key,mesh);
}

function removeBlock(b) {
  const key=`${b.x},${b.y},${b.z}`;
  const mesh=blockMeshes.get(key);
  if(mesh){scene.remove(mesh);blockMeshes.delete(key);}
}

function createTree(x,z) {
  box(scene,mats.wood,x,.8,z,.3,1.6,.3);
  for(let y=1.5;y<=2.6;y+=.5){
    const leaves=box(scene,mats.leaf,x,y,z,1.5-(y-1.5)*.25,1,1.5-(y-1.5)*.25);
    leaves.userData.decoration=true;
  }
}

function createDecorations(){
  for(let i=0;i<20;i++){
    const x=Math.floor(Math.random()*48)-24;
    const z=Math.floor(Math.random()*48)-24;
    if(Math.abs(x)<5&&Math.abs(z)<5)continue;
    if(Math.random()<.7)createTree(x,z);
  }
  // Dekorativní královský portál
  for(let y=1;y<=4;y++){
    addBlock({x:5,y,z:-5,type:"gold"});
    addBlock({x:8,y,z:-5,type:"gold"});
  }
  for(let x=5;x<=8;x++)addBlock({x,y:5,z:-5,type:"pink"});
}

function makeRemote(p){
  if(remotePlayers.has(p.id))return;
  const group=new THREE.Group();
  box(group,mats.pink,0,.78,0,.58,.68,.34);
  box(group,mats.skin,0,1.35,0,.43,.43,.4);
  box(group,mats.gold,0,1.65,0,.46,.12,.25);
  const label=makeLabel(p.name);
  label.position.y=2.2;
  group.add(label);
  group.position.set(p.x,p.y-1.01,p.z);
  scene.add(group);
  remotePlayers.set(p.id,group);
}

function removeRemote(id){
  const p=remotePlayers.get(id);
  if(p){scene.remove(p);remotePlayers.delete(id);}
}

function notice(text){
  const el=$("notice");
  el.textContent=text;
  el.style.display="block";
  clearTimeout(notice.timer);
  notice.timer=setTimeout(()=>el.style.display="none",1800);
}

function connect(){
  if(typeof io!=="function"){
    $("status").textContent="Chybí Socket.IO. Zkontroluj server.js.";
    return;
  }
  socket=io({reconnection:true});
  socket.on("connect",()=>{
    $("connection").textContent="🟢 Online";
    socket.emit("player:join",{name:playerName});
  });
  socket.on("disconnect",()=>{
    $("connection").textContent="🔴 Odpojeno";
  });
  socket.on("connect_error",()=>{
    $("connection").textContent="🔴 Připojení selhalo";
  });
  socket.on("world:init",data=>{
    data.blocks.forEach(addBlock);
    data.players.forEach(makeRemote);
  });
  socket.on("player:joined",p=>{
    myId=p.id;
    joined=true;
    $("players").textContent="Online";
  });
  socket.on("player:created",makeRemote);
  socket.on("player:moved",p=>{
    const r=remotePlayers.get(p.id);
    if(r){
      r.position.set(p.x,p.y-1.01,p.z);
      r.rotation.y=p.rotation||0;
    }
  });
  socket.on("player:left",removeRemote);
  socket.on("players:count",n=>$("players").textContent=`Hráči: ${n}`);
  socket.on("block:placed",addBlock);
  socket.on("block:broken",removeBlock);
  socket.on("chat:message",m=>{
    const el=document.createElement("div");
    el.textContent=`${m.name}: ${m.message}`;
    $("messages").appendChild(el);
    while($("messages").children.length>5)
      $("messages").firstChild.remove();
    setTimeout(()=>el.remove(),12000);
  });
}

$("play").addEventListener("click",()=>{
  playerName=$("name").value.trim().slice(0,18)||"GucciKaja";
  myLabel.material.map.dispose();
  myLabel.material.map=null;
  avatar.remove(myLabel);
  const label=makeLabel(playerName,"#ffdf80");
  label.position.set(0,2.25,0);
  avatar.add(label);
  $("start").style.display="none";
  connect();
  createDecorations();
  notice("Vítej ve světě Gucci Kaja!");
});

$("name").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("play").click();
});

document.querySelectorAll("[data-type]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedType=btn.dataset.type;
    document.querySelectorAll("[data-type]").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
  });
});

$("camera").addEventListener("click",()=>{
  cameraMode=(cameraMode+1)%3;
  notice(["Kamera: za hráčem","Kamera: blíže","Kamera: dál"][cameraMode]);
});

function targetBlock(){
  raycaster.setFromCamera(center,camera);
  const meshes=Array.from(blockMeshes.values());
  const hits=raycaster.intersectObjects(meshes,false);
  return hits.find(h=>h.distance<7);
}

function placeBlock(){
  if(!socket||!joined)return;
  const hit=targetBlock();
  if(!hit)return notice("Zaměř blok, vedle kterého chceš stavět.");
  const n=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const p=hit.object.position.clone().add(n);
  const x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);
  if(y<1)return;
  if(Math.abs(x-world.x)<.8&&Math.abs(z-world.z)<.8&&y<world.y+2)
    return notice("Nemůžeš stavět do sebe.");
  socket.emit("block:place",{x,y,z,type:selectedType});
}

function breakBlock(){
  if(!socket||!joined)return;
  const hit=targetBlock();
  if(!hit)return notice("Zaměř blok, který chceš zbourat.");
  const b=hit.object.userData.block;
  if(!b)return;
  socket.emit("block:break",b);
}

$("place").addEventListener("click",placeBlock);
$("break").addEventListener("click",breakBlock);
$("jump").addEventListener("click",()=>{
  if(onGround){velocityY=7.2;onGround=false;}
});

$("send").addEventListener("click",sendChat);
$("chatinput").addEventListener("keydown",e=>{
  if(e.key==="Enter")sendChat();
});
function sendChat(){
  const input=$("chatinput");
  const message=input.value.trim();
  if(!message||!socket||!joined)return;
  socket.emit("chat:send",{message});
  input.value="";
}

// Virtuální joystick
const joy=$("joy"),knob=$("knob");
let joyPointer=null;
function joyUpdate(e){
  const r=joy.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);
  const max=r.width*.32;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joyX=dx/max;
  joyY=dy/max;
  knob.style.left=`${r.width/2-22+dx}px`;
  knob.style.top=`${r.height/2-22+dy}px`;
}
joy.addEventListener("pointerdown",e=>{
  joyPointer=e.pointerId;
  joy.setPointerCapture(e.pointerId);
  joyUpdate(e);
});
joy.addEventListener("pointermove",e=>{
  if(e.pointerId===joyPointer)joyUpdate(e);
});
function joyEnd(){
  joyPointer=null;joyX=0;joyY=0;
  knob.style.left="calc(50% - 22px)";
  knob.style.top="calc(50% - 22px)";
}
joy.addEventListener("pointerup",joyEnd);
joy.addEventListener("pointercancel",joyEnd);

// Myš a dotyk pro otáčení kamery
let lookPointer=null,lastX=0,lastY=0;
renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  if(e.clientY>innerHeight-150&&e.clientX<155)return;
  lookPointer=e.pointerId;
  lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove",e=>{
  if(e.pointerId!==lookPointer)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  yaw-=dx*.006;
  pitch=Math.max(-.45,Math.min(.8,pitch+dy*.004));
});
renderer.domElement.addEventListener("pointerup",()=>lookPointer=null);
renderer.domElement.addEventListener("pointercancel",()=>lookPointer=null);

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))
    e.preventDefault();
  if(e.code==="Space"&&onGround){velocityY=7.2;onGround=false;}
  if(e.code==="KeyE")placeBlock();
  if(e.code==="KeyQ")breakBlock();
});
addEventListener("keyup",e=>keys[e.code]=false);

function collides(x,y,z){
  const radius=.27;
  const feet=y-.01;
  const head=y+1.72;
  for(let bx=Math.floor(x-radius);bx<=Math.floor(x+radius);bx++){
    for(let bz=Math.floor(z-radius);bz<=Math.floor(z+radius);bz++){
      for(let by=Math.floor(feet);by<=Math.floor(head);by++){
        if(blockMeshes.has(`${bx},${by},${bz}`)){
          const overlapsX=x+radius>bx-.5&&x-radius<bx+.5;
          const overlapsZ=z+radius>bz-.5&&z-radius<bz+.5;
          const overlapsY=head>by-.5&&feet<by+.5;
          if(overlapsX&&overlapsZ&&overlapsY)return true;
        }
      }
    }
  }
  return false;
}

function update(dt){
  if(!joined)return;
  let forward=0,side=0;
  if(keys.KeyW||keys.ArrowUp)forward+=1;
  if(keys.KeyS||keys.ArrowDown)forward-=1;
  if(keys.KeyD||keys.ArrowRight)side+=1;
  if(keys.KeyA||keys.ArrowLeft)side-=1;
  forward+=-joyY;
  side+=joyX;
  const length=Math.hypot(forward,side);
  if(length>1){forward/=length;side/=length;}
  const speed=5.2;
  const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;
  const dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;

  if(!collides(world.x+dx,world.y,world.z))world.x+=dx;
  if(!collides(world.x,world.y,world.z+dz))world.z+=dz;

  velocityY-=18*dt;
  let newY=world.y+velocityY*dt;
  if(newY<=1.01){
    newY=1.01;velocityY=0;onGround=true;
  }else if(collides(world.x,newY,world.z)){
    if(velocityY<0)onGround=true;
    velocityY=0;
    newY=world.y;
  }else onGround=false;
  world.y=newY;

  avatar.position.set(world.x,world.y-1.01,world.z);
  avatar.rotation.y=yaw+Math.PI;

  const distance=cameraMode===0?6.5:cameraMode===1?4:10;
  const horizontal=Math.cos(pitch)*distance;
  const desired=new THREE.Vector3(
    world.x-Math.sin(yaw)*horizontal,
    world.y+1.3+Math.sin(pitch)*distance,
    world.z-Math.cos(yaw)*horizontal
  );
  camera.position.lerp(desired,Math.min(1,dt*8));
  camera.lookAt(world.x,world.y+1.0,world.z);

  const now=performance.now();
  if(socket&&now-lastMove>65){
    socket.emit("player:move",{
      x:world.x,y:world.y-1.01,z:world.z,rotation:yaw
    });
    lastMove=now;
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.035);
  update(dt);
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});
</script>
</body>
</html>
