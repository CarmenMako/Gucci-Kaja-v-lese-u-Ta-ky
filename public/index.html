<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Gucci Kája v Lese u Taťky</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background: #010204; font-family: 'Poppins', sans-serif; touch-action: none; color: white; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Zaměřovací kříž uprostřed obrazovky */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); pointer-events: none; z-index: 6; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.7); }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 5; }
        h1 { margin: 0; font-size: 14px; font-weight: 800; color: #ff3366; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .stats-card { margin-top: 4px; background: rgba(10, 15, 25, 0.75); border: 1px solid rgba(255,255,255,0.15); padding: 5px 10px; border-radius: 8px; backdrop-filter: blur(6px); display: inline-flex; gap: 8px; font-size: 10px; }

        /* Přepínač inventáře / nástrojů nahoře vpravo */
        #tool-selector { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 10; pointer-events: auto; }
        .tool-btn { padding: 8px 12px; background: rgba(20, 30, 45, 0.7); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; font-size: 11px; font-weight: bold; color: white; cursor: pointer; backdrop-filter: blur(6px); }
        .tool-btn.active { border-color: #ff3366; background: rgba(255, 51, 102, 0.3); }

        /* Start Modal */
        #name-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 4, 8, 0.96); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: rgba(20, 30, 45, 0.85); border: 1px solid rgba(255,255,255,0.2); padding: 24px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .modal-box h2 { color: #ff3366; margin: 0 0 10px 0; font-size: 18px; }
        .modal-box input { width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0b111e; color: white; text-align: center; margin-bottom: 15px; outline: none; }
        .modal-box button { width: 100%; padding: 12px; font-size: 14px; font-weight: 800; background: #ff3366; color: white; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }

        /* Joystick vlevo */
        #joystick-container { width: 90px; height: 90px; position: absolute; bottom: 20px; left: 20px; pointer-events: auto; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; z-index: 10; }
        #joystick { width: 40px; height: 40px; background: rgba(255,255,255,0.7); border-radius: 50%; position: absolute; top: 23px; left: 23px; touch-action: none; }

        /* Akční tlačítka vpravo dole */
        .action-buttons { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 12px; z-index: 10; pointer-events: auto; }
        .btn { width: 60px; height: 60px; background: rgba(15, 23, 42, 0.75); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; color: white; font-weight: 800; font-size: 9px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); flex-direction: column; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.9); }
        .btn-icon { font-size: 18px; margin-bottom: 2px; }
        #btn-action { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); }
        #btn-build { border-color: #f59e0b; background: rgba(245, 158, 11, 0.2); }
        #btn-eat { border-color: #10b981; background: rgba(16, 185, 129, 0.2); }

        /* Pravá plocha pro rozhlížení prstem */
        #look-touch-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 5; pointer-events: auto; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="name-modal">
        <div class="modal-box">
            <h2>GUCCI KÁJA V LESE</h2>
            <p style="font-size:11px; color:#94a3b8; margin-bottom:15px;">Zadej jméno královny:</p>
            <input type="text" id="player-name-input" value="Královna Kája" maxlength="15">
            <button id="start-game-btn">VSTOUPIT DO LESA</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="canvas-container"></div>
    <div id="look-touch-zone"></div>

    <div id="tool-selector">
        <button class="tool-btn active" id="tool-axe">🪓 Sekyra</button>
        <button class="tool-btn" id="tool-gun">🔫 Samopal</button>
    </div>

    <div id="ui">
        <h1>GUCCI KÁJA V LESE</h1>
        <div class="stats-card">
            <div>🪵 Dřevo: <span id="wood-count">0</span></div>
            <div>🥩 Maso: <span id="meat-count">0</span></div>
            <div>❤️ HP: <span id="hp-count">100</span></div>
            <div>🕒 Čas: <span id="time-status">Den ☀️</span></div>
        </div>
    </div>

    <div id="joystick-container">
        <div id="joystick"></div>
    </div>

    <div class="action-buttons">
        <div class="btn" id="btn-action"><span class="btn-icon" id="action-icon">🪓</span><span id="action-text">SEKAT</span></div>
        <div class="btn" id="btn-build"><span class="btn-icon">🪵</span>STAVĚT</div>
        <div class="btn" id="btn-eat"><span class="btn-icon">🍖</span>JÍST</div>
    </div>

    <script>
        const socket = io();
        let playerName = "Kája";
        let activeTool = 'axe'; // 'axe' nebo 'gun'

        document.getElementById('start-game-btn').addEventListener('click', () => {
            const val = document.getElementById('player-name-input').value.trim();
            if(val) playerName = val;
            document.getElementById('name-modal').style.display = 'none';
            socket.emit('joinGame', playerName);
        });

        // Přepínání nástrojů
        document.getElementById('tool-axe').addEventListener('click', () => {
            activeTool = 'axe';
            document.getElementById('tool-axe').classList.add('active');
            document.getElementById('tool-gun').classList.remove('active');
            document.getElementById('action-icon').innerText = '🪓';
            document.getElementById('action-text').innerText = 'SEKAT';
            updatePlayerWeapon();
        });

        document.getElementById('tool-gun').addEventListener('click', () => {
            activeTool = 'gun';
            document.getElementById('tool-gun').classList.add('active');
            document.getElementById('tool-axe').classList.remove('active');
            document.getElementById('action-icon').innerText = '💥';
            document.getElementById('action-text').innerText = 'STŘÍLET';
            updatePlayerWeapon();
        });

        // --- SCÉNA A OSVĚTLENÍ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1128);
        scene.fog = new THREE.FogExp2(0x0a1128, 0.02);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
        sunLight.position.set(40, 60, 40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Země
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x112211, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Stromy
        const trees = [];
        for(let i=0; i<60; i++) {
            const x = (Math.random() - 0.5) * 160;
            const z = (Math.random() - 0.5) * 160;
            if(Math.hypot(x, z) > 6) {
                const group = new THREE.Group();
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.6, 4.5),
                    new THREE.MeshStandardMaterial({ color: 0x3d2314 })
                );
                trunk.position.y = 2.25;
                trunk.castShadow = true;
                group.add(trunk);

                const leaves = new THREE.Mesh(
                    new THREE.ConeGeometry(2.5, 5.5, 6),
                    new THREE.MeshStandardMaterial({ color: 0x0f3d1f })
                );
                leaves.position.y = 5.5;
                leaves.castShadow = true;
                group.add(leaves);

                group.position.set(x, 0, z);
                scene.add(group);
                trees.push({ x, z, hp: 3, mesh: group });
            }
        }

        // --- ZVÍŘATA (ZAJÍCI A VLCI) ---
        const animals = [];
        function spawnAnimal(type) {
            const group = new THREE.Group();
            const color = type === 'wolf' ? 0x4a4a4a : 0xd3b88d;
            const size = type === 'wolf' ? 0.8 : 0.4;
            
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(size, size, size * 1.5),
                new THREE.MeshStandardMaterial({ color: color })
            );
            body.position.y = size / 2;
            group.add(body);

            const x = (Math.random() - 0.5) * 140;
            const z = (Math.random() - 0.5) * 140;
            group.position.set(x, 0, z);
            scene.add(group);

            animals.push({ type: type, mesh: group, hp: type === 'wolf' ? 2 : 1, speed: type === 'wolf' ? 0.06 : 0.04 });
        }

        // Vytvoříme 3 vlky a 6 zajíců
        for(let i=0; i<3; i++) spawnAnimal('wolf');
        for(let i=0; i<6; i++) spawnAnimal('rabbit');

        // --- MODEL KRÁLOVNY S DATOVÝMI SKUPINAMI PRO VÝBAVU ---
        const queenGroup = new THREE.Group();
        
        // Šaty
        const dress = new THREE.Mesh(
            new THREE.ConeGeometry(0.45, 1.2, 12),
            new THREE.MeshStandardMaterial({ color: 0xff2a5f, roughness: 0.4 })
        );
        dress.position.y = 0.6;
        dress.castShadow = true;
        queenGroup.add(dress);

        // Hlava
        const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.25, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xffdbac })
        );
        head.position.y = 1.35;
        queenGroup.add(head);

        // Koruna
        const crown = new THREE.Mesh(
            new THREE.ConeGeometry(0.2, 0.3, 4),
            new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8 })
        );
        crown.position.y = 1.65;
        queenGroup.add(crown);

        // Nástroj v ruce (sekyra / samopal)
        const weaponHolder = new THREE.Group();
        queenGroup.add(weaponHolder);
        weaponHolder.position.set(0.35, 0.7, -0.2);

        function updatePlayerWeapon() {
            while(weaponHolder.children.length > 0) { weaponHolder.remove(weaponHolder.children[0]); }
            if(activeTool === 'axe') {
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.7), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
                handle.rotation.z = Math.PI / 2;
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.18), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 }));
                blade.position.set(0, 0.12, 0);
                weaponHolder.add(handle, blade);
            } else {
                const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 }));
                const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.15), new THREE.MeshStandardMaterial({ color: 0xff3366 }));
                scope.rotation.x = Math.PI / 2;
                scope.position.set(0, 0.08, 0);
                weaponHolder.add(gunBody, scope);
            }
        }
        updatePlayerWeapon();
        scene.add(queenGroup);

        let wood = 0;
        let meat = 0;
        let hp = 100;
        let barricadesCount = 0;
        let playerPosX = 0, playerPosZ = 0;
        let cameraAngleY = 0;
        let gameTime = 0; // Pro střídání dne a noci

        // --- JOYSTICK ---
        const joystick = document.getElementById('joystick');
        const joystickContainer = document.getElementById('joystick-container');
        let joyMove = { x: 0, y: 0 };
        const joyRect = joystickContainer.getBoundingClientRect();
        const joyRadius = joyRect.width / 2;
        const joyCenter = joyRect.width / 2;

        joystick.addEventListener('touchstart', (e) => e.preventDefault());
        document.addEventListener('touchend', () => {
            joystick.style.transform = `translate(0px, 0px)`;
            joyMove = { x: 0, y: 0 };
        });
        document.addEventListener('touchmove', (e) => {
            if(!e.touches.length) return;
            const touch = e.touches[0];
            const dx = touch.clientX - joyRect.left - joyCenter;
            const dy = touch.clientY - joyRect.top - joyCenter;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const clampedDist = Math.min(dist, joyRadius);
            const angle = Math.atan2(dy, dx);
            joystick.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
            joyMove = { 
                x: (Math.cos(angle) * clampedDist) / joyRadius, 
                y: (Math.sin(angle) * clampedDist) / joyRadius 
            };
        });

        // --- OTÁČENÍ KAMERY PRSTEM (CoD style) ---
        let isLooking = false;
        let lastTouchX = 0;
        const lookZone = document.getElementById('look-touch-zone');
        lookZone.addEventListener('touchstart', (e) => { isLooking = true; lastTouchX = e.touches[0].clientX; });
        lookZone.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            const currentX = e.touches[0].clientX;
            cameraAngleY -= (currentX - lastTouchX) * 0.005;
            lastTouchX = currentX;
        });
        lookZone.addEventListener('touchend', () => { isLooking = false; });

        // --- HLAVNÍ AKČNÍ TLAČÍTKO (Sekání stromů nebo střelba) ---
        document.getElementById('btn-action').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(activeTool === 'axe') {
                trees.forEach((tree) => {
                    if(Math.hypot(playerPosX - tree.x, playerPosZ - tree.z) < 4.5) {
                        wood += 5;
                        document.getElementById('wood-count').innerText = wood;
                    }
                });
            } else {
                // Střelba na zvířata
                animals.forEach((animal, index) => {
                    if(Math.hypot(playerPosX - animal.mesh.position.x, playerPosZ - animal.mesh.position.z) < 8) {
                        animal.hp--;
                        if(animal.hp <= 0) {
                            scene.remove(animal.mesh);
                            animals.splice(index, 1);
                            meat += 2;
                            document.getElementById('meat-count').innerText = meat;
                            // Respawn zvířete po chvíli
                            setTimeout(() => spawnAnimal(Math.random() > 0.5 ? 'wolf' : 'rabbit'), 8000);
                        }
                    }
                });
            }
        });

        // Stavění barikády
        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(wood >= 10) {
                wood -= 10;
                document.getElementById('wood-count').innerText = wood;
                const bx = playerPosX + Math.sin(cameraAngleY) * 2;
                const bz = playerPosZ + Math.cos(cameraAngleY) * 2;
                const bar = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 1.5, 0.4),
                    new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
                );
                bar.position.set(bx, 0.75, bz);
                scene.add(bar);
                barricadesCount++;
            }
        });

        // Jíst maso (doplnění HP)
        document.getElementById('btn-eat').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(meat > 0 && hp < 100) {
                meat--;
                hp = Math.min(100, hp + 30);
                document.getElementById('meat-count').innerText = meat;
                document.getElementById('hp-count').innerText = hp;
            }
        });

        // Multiplayer synchronizace
        const otherPlayers = {};
        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach((id) => { if (id !== socket.id) addOtherPlayer(players[id]); });
        });
        socket.on('newPlayer', (info) => addOtherPlayer(info));
        socket.on('playerMoved', (info) => {
            if (otherPlayers[info.id]) {
                otherPlayers[info.id].position.set(info.x, info.y, info.z);
                otherPlayers[info.id].rotation.y = info.rotation;
            }
        });

        function addOtherPlayer(info) {
            const pMesh = queenGroup.clone();
            pMesh.position.set(info.x, info.y, info.z);
            scene.add(pMesh);
            otherPlayers[info.id] = pMesh;
        }

        // --- HLAVNÍ HERNÍ SMYČKA ---
        const speed = 0.15;
        function animate() {
            requestAnimationFrame(animate);

            // Střídání dne a noci
            gameTime += 0.002;
            const cycle = Math.sin(gameTime);
            if(cycle > 0) {
                scene.background.setHex(0x0a1128);
                scene.fog.color.setHex(0x0a1128);
                sunLight.intensity = 1.4;
                document.getElementById('time-status').innerText = "Den ☀️";
            } else {
                scene.background.setHex(0x020308);
                scene.fog.color.setHex(0x020308);
                sunLight.intensity = 0.3;
                document.getElementById('time-status').innerText = "Noc 🌙";
            }

            // Pohyb hráče
            if (joyMove.x !== 0 || joyMove.y !== 0) {
                const moveX = (-joyMove.x * Math.cos(cameraAngleY) - joyMove.y * Math.sin(cameraAngleY));
                const moveZ = (-joyMove.x * Math.sin(cameraAngleY) + joyMove.y * Math.cos(cameraAngleY));
                
                playerPosX += moveX * speed;
                playerPosZ += moveZ * speed;
                playerPosX = Math.max(-90, Math.min(90, playerPosX));
                playerPosZ = Math.max(-90, Math.min(90, playerPosZ));

                queenGroup.position.set(playerPosX, 0, playerPosZ);
                queenGroup.rotation.y = cameraAngleY + Math.atan2(joyMove.x, joyMove.y);
            }

            // Pohyb zvířat / vlků za hráčem
            animals.forEach(animal => {
                const dx = playerPosX - animal.mesh.position.x;
                const dz = playerPosZ - animal.mesh.position.z;
                const dist = Math.hypot(dx, dz);
                if(animal.type === 'wolf' && dist < 35) {
                    animal.mesh.position.x += (dx / dist) * animal.speed;
                    animal.mesh.position.z += (dz / dist) * animal.speed;
                    animal.mesh.rotation.y = Math.atan2(dx, dz);
                    if(dist < 2.0) {
                        hp = Math.max(0, hp - 0.2);
                        document.getElementById('hp-count').innerText = Math.floor(hp);
                    }
                }
            });

            // Kamera sledování
            const camDist = 5.5;
            camera.position.x = playerPosX + Math.sin(cameraAngleY) * camDist;
            camera.position.y = 3.2;
            camera.position.z = playerPosZ + Math.cos(cameraAngleY) * camDist;
            camera.lookAt(playerPosX, 1.2, playerPosZ);

            socket.emit('playerMovement', { x: playerPosX, y: 0, z: playerPosZ, rotation: queenGroup.rotation.y });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
